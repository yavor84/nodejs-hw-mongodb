tags:
  - Contacts
summary: Update a contact
operationId: patchContact
description: Update an existing contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    description: Contact's id
    example: 60d5ec49f8c6e2001c8a4f91
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: New name for the contact.
            example: Jane Doe Updated
          phoneNumber:
            type: string
            description: New phone number for the contact.
            example: '+380991234567'
          email:
            type: string
            format: email
            description: New email for the contact.
            example: janedoe.updated@gmail.com
          isFavourite:
            type: boolean
            description: New favorite status for the contact.
            example: false
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: New type for the contact.
            example: personal
          photo:
            type: string
            format: binary
            description: New photo for the contact.
responses:
  '200':
    description: Successfully patched a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
