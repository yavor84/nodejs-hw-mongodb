tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Delete an existing contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    description: Contact's id
    example: 60d5ec49f8c6e2001c8a4f91
responses:
  '204':
    description: Successfully deleted the contact (No Content).
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: '../../../components/responses/500.yaml'
