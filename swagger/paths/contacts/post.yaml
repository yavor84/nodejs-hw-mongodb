tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact's name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380634567890'
          email:
            type: string
            description: Contact's email
            example: johndoe@gmail.com
          isFavourite:
            type: boolean
            description: Contact is is favourite
            example: true
            default: false
          contactType:
            type: string
            description: Type of contact's phone number
            enum: ['work', 'home', 'personal']
            example: home
          photo:
            type: string
            format: binary
            description: Contact's photo
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
